<html>
<head>
  <meta charset="utf-8">
  <title>J2329-1258</title>
  <style>
    [v-cloak] { display: none; }
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    #plot { width: 100%; height: 700px; }
    .card { border:1px solid #e5e5e5; border-radius:8px; background:#fafafa; padding:14px; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .row + .row { margin-top: 8px; }
    .label { font-weight:600; margin-right:6px; }
    .small { font-size: 12px; color:#666; }
    .pill { padding:4px 8px; border-radius:14px; border:1px solid #ddd; background:#fff; cursor:pointer; }
    .pill.active { background:#e7f1ff; border-color:#9ec1ff; }
    .grid { display:grid; grid-template-columns: 1fr 320px; gap: 16px; }
    .controls { display:grid; gap:10px; }
    .images { max-height: 280px; overflow:auto; border:1px solid #eee; padding:8px; border-radius:8px; background:#fff; }
    .images .row { justify-content: space-between; }
    input[type="number"] { width: 100px; }
    .sticky { position: sticky; top: 12px; }
  </style>
</head>

  <div id="app" v-cloak class="container">
    <h2 style="margin-top:0;">J2329-1258</h2>

    <div class="grid">
      <div>
        <div id="plot" class="card"></div>
        <div class="small">
          Tips: Click on a curve to select it. Hold Cmd/Ctrl and click to snap the nearest point of the selected curve to your click (updates ΔT, ΔM).
        </div>
      </div>

      <div class="controls sticky">
        <div class="card">
          <h3 class="cp-title">Curves</h3>
          <div class="row" v-for="c in curves" :key="c.name">
            <label class="label">
              <input type="checkbox" v-model="c.visible" @change="draw">

            </label>
            <label class="small">
              <input type="checkbox" v-model="c.showErrors" @change="draw">

          </div>
          <div v-if="!curves.length" class="small">No curves found.</div>

          <div class="row">

          </div>
          <div class="row" style="margin-top:8px;" v-if="activeCurve && showDeltas">
            <label>ΔT <input type="number" step="0.01" v-model.number="activeCurve.offsetX" @input="draw"></label>

    x: gd.layout.xaxis.range ? [...gd.layout.xaxis.range] : null,
    y: gd.layout.yaxis.range ? [...gd.layout.yaxis.range] : null
  };
}

const layout = {
  margin: { t: 20, r: 20, b: 55, l: 70 },
  xaxis: { title: 'mjd (MJD)' },
  yaxis: { title: 'Magnitude (mag)', autorange: 'reversed' },
  hoverlabel: { bgcolor: '#222', font: { color: 'white' } },
  legend: { orientation: 'h' },
};

window.Plotly.react('plot', traces, layout, {displaylogo:false, responsive:true}).then(() => {
  if (currentRanges && currentRanges.x && currentRanges.y) {
    Plotly.relayout(gd, {
      'xaxis.range': currentRanges.x,
      'yaxis.range': currentRanges.y
    });
  }
});
},
          }
        });

        // Click to activate curve; Cmd/Ctrl+Click to shift it to clicked coords
        const plotDiv = document.getElementById('plot');
        plotDiv.on = window.Plotly.d3.select(plotDiv).on; // ensure .on exists (Plotly binds d3 selection)

        plotDiv.on('plotly_click', function(ev){
          if (!ev || !ev.points || !ev.points.length) return;
          const pt = ev.points[0];
          const traceName = (pt.data && pt.data.name) ? pt.data.name : null;
          if (traceName){
            const clicked = vm.curves.find(c => c.name === traceName);
            if (clicked) vm.activeCurve = clicked;
          }
          // Only shift with Cmd/Ctrl
          if (!(ev.event && (ev.event.ctrlKey || ev.event.metaKey))) return;
          if (!vm.activeCurve) return;

          const xVal = pt.x, yVal = pt.y;
          const idx = vm.filteredIndices();
          let bestIdx = -1, bestDist = 1e99;
          for (const k of idx){
            const xi = vm.activeCurve.x[k] + (vm.activeCurve.offsetX || 0);
            const yi = vm.activeCurve.y[k] + (vm.activeCurve.offsetY || 0);
            const d2 = (xi - xVal)*(xi - xVal) + (yi - yVal)*(yi - yVal);
            if (d2 < bestDist){ bestDist = d2; bestIdx = k; }
          }
          if (bestIdx >= 0){
            const baseX = vm.activeCurve.x[bestIdx];
            const baseY = vm.activeCurve.y[bestIdx];
            vm.activeCurve.offsetX += (xVal - (baseX + (vm.activeCurve.offsetX||0)));
            vm.activeCurve.offsetY += (yVal - (baseY + (vm.activeCurve.offsetY||0)));
            vm.draw();
          }
        });
      }

      if (document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
    })();
  </script>
