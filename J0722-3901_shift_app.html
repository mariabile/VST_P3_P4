<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>J0722-3901</title>
  <style>
    [v-cloak] { display: none; }
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    #plot { width: 100%; height: 700px; }
    .card { border:1px solid #e5e5e5; border-radius:8px; background:#fafafa; padding:14px; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .row + .row { margin-top: 8px; }
    .label { font-weight:600; margin-right:6px; }
    .small { font-size: 12px; color:#666; }
    .pill { padding:4px 8px; border-radius:14px; border:1px solid #ddd; background:#fff; cursor:pointer; }
    .pill.active { background:#e7f1ff; border-color:#9ec1ff; }
    .grid { display:grid; grid-template-columns: 1fr 320px; gap: 16px; }
    .controls { display:grid; gap:10px; }
    .images { max-height: 280px; overflow:auto; border:1px solid #eee; padding:8px; border-radius:8px; background:#fff; }
    .images .row { justify-content: space-between; }
    input[type="number"] { width: 100px; }
    .sticky { position: sticky; top: 12px; }

    /* --- password gate --- */
    .gate { max-width: 380px; margin: 12vh auto 0; }
    .gate h2 { margin: 0 0 4px; font-size: 20px; }
    .gate p { margin: 0 0 16px; font-size: 13px; color: #666; line-height: 1.5; }
    .gate input[type="password"] {
      width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 14px;
      font-family: inherit; border: 1px solid #ccc; border-radius: 6px; background: #fff;
    }
    .gate input[type="password"]:focus { outline: 2px solid #9ec1ff; outline-offset: 1px; border-color: #9ec1ff; }
    .gate button {
      margin-top: 10px; width: 100%; padding: 9px 12px; font-size: 14px; font-family: inherit;
      border: 1px solid #9ec1ff; border-radius: 6px; background: #e7f1ff; cursor: pointer;
    }
    .gate button:disabled { opacity: .6; cursor: default; }
    .gate-msg { margin-top: 12px; font-size: 13px; color: #b3261e; display: none; }
  </style>
</head>

        </div>

      const PALETTE = ["royalblue", "mediumvioletred", "lightseagreen", "orange", "crimson", "teal", "goldenrod", "slateblue", "tomato", "seagreen"];

      let RAW = null;

      // ---------------- decryption ----------------
      function b64ToBytes(s){
        const bin = atob(s);
        const out = new Uint8Array(bin.length);
        for (let i=0;i<bin.length;i++){ out[i] = bin.charCodeAt(i); }
        return out;
      }
      function decryptPayload(password){
        const enc = PAYLOAD.enc;
        return crypto.subtle.importKey(
          'raw', new TextEncoder().encode(password), {name:'PBKDF2'}, false, ['deriveKey']
        ).then(function(km){
          return crypto.subtle.deriveKey(
            {name:'PBKDF2', salt:b64ToBytes(enc.salt), iterations:enc.iters, hash:'SHA-256'},
            km, {name:'AES-GCM', length:256}, false, ['decrypt']
          );
        }).then(function(key){
          return crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToBytes(enc.iv)}, key, b64ToBytes(enc.ct));
        }).then(function(buf){
          return JSON.parse(new TextDecoder().decode(buf));
        });
      }

      // ---------------- random per-curve shifts ----------------
      function uniqueRandomShifts(n){
        const pool = Array.from({length:100}, (_,i)=>i+1);
        for (let i = pool.length - 1; i > 0; i--){
          const j = Math.floor(Math.random() * (i + 1));
          const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
        }
        const out = [];
        for (let k=0;k<n;k++){ out.push(pool[k % pool.length]); }
        return out;
      }
      function assignRandomShifts(){
        const shifts = uniqueRandomShifts(RAW.curves.length);
        for (let i=0;i<RAW.curves.length;i++){
          RAW.curves[i].randomShiftDays = shifts[i];
        }
      }

      function start(){

          mounted(){ this.draw(); },
          methods: {
            selectAllImages(v){ /* panel removed */ this.draw(); },
            filteredIndices(){
              const img = RAW.point_images || [];
              const out = [];
              for (let i=0;i<img.length;i++){ out.push(i); }
              return out;
            },
            buildTrace(c){
              const idx = this.filteredIndices();
              const xsAll = c.x, ysAll = c.y, errAll = c.err || [];

              for (let k=0;k<xsAll.length;k++){
                if (idx.indexOf(k) !== -1){
                  xs.push(xsAll[k] + (c.randomShiftDays || 0));

                  if (errAll.length === xsAll.length) es.push(errAll[k]);
                }
              }
              const hasErr = es.length === xs.length && xs.length>0;
              const t = {
                x: xs, y: ys, name: c.name, mode: 'markers',
                marker: { size: 6, color: c.color },
                textfont: { color: 'white' },
                visible: c.visible ? true : 'legendonly',
                hovertemplate: c.name + '_mag=%{y:.4f}' +
                     (hasErr ? '<br>err=%{customdata:.4f}' : '') + '<extra></extra>',

                  bgcolor: c.color,          // same color as the point
                  font: { color: 'white' },  // white text for readability
                  bordercolor: c.color       // optional, makes the border blend in

              };
              if (c.showErrors && hasErr){
                t.error_y = { type: 'data', array: es, visible: true, color: c.color };
                t.customdata = es;
              }
              return t;
            },
            draw(){
              const traces = [];
              for (const c of this.curves){
                if (!c.visible) continue;
                traces.push(this.buildTrace(c));
              }

              const gd = document.getElementById('plot');
              let currentRanges = null;
              if (gd && gd.layout && gd.layout.xaxis && gd.layout.yaxis) {
                currentRanges = {
                  x: gd.layout.xaxis.range ? [...gd.layout.xaxis.range] : null,
                  y: gd.layout.yaxis.range ? [...gd.layout.yaxis.range] : null
                };
              }

              const layout = {
                margin: { t: 20, r: 20, b: 55, l: 70 },
                xaxis: { title: 'mjd (MJD)' },
                yaxis: { title: 'Magnitude (mag)', autorange: 'reversed' },
                hoverlabel: { bgcolor: '#222', font: { color: 'white' } },
                legend: { orientation: 'h' },
              };

              window.Plotly.react('plot', traces, layout, {displaylogo:false, responsive:true}).then(() => {
                if (currentRanges && currentRanges.x && currentRanges.y) {
                  Plotly.relayout(gd, {
                    'xaxis.range': currentRanges.x,
                    'yaxis.range': currentRanges.y
                  });
                }
              });
            },
          }
        });
      }

      function run(raw){
        RAW = raw;
        assignRandomShifts();
        document.getElementById('gate').style.display = 'none';
        boot();
      }

      // ---------------- gate wiring ----------------
      function showMsg(text){
        const el = document.getElementById('gate-msg');
        el.textContent = text;
        el.style.display = text ? 'block' : 'none';
      }

      function initGate(){
        const gate = document.getElementById('gate');
        const input = document.getElementById('gate-pass');
        const btn = document.getElementById('gate-btn');
        gate.style.display = 'block';

        if (!window.crypto || !window.crypto.subtle){
          btn.disabled = true;
          showMsg('This page must be served over https to decrypt. Open it with an https:// address.');
          return;
        }

        function attempt(pw, fromCache){
          if (!pw){ showMsg('Enter the password.'); return; }
          btn.disabled = true;
          showMsg(fromCache ? '' : 'Unlocking...');
          decryptPayload(pw).then(function(raw){
            try { sessionStorage.setItem(SESSION_KEY, pw); } catch(e){}
            run(raw);
          }).catch(function(){
            try { sessionStorage.removeItem(SESSION_KEY); } catch(e){}
            btn.disabled = false;
            showMsg('That password does not match. Try again.');
            input.value = '';
            input.focus();
          });
        }

        btn.addEventListener('click', function(){ attempt(input.value, false); });
        input.addEventListener('keydown', function(e){
          if (e.key === 'Enter'){ attempt(input.value, false); }
        });

        // Reloads are frequent here (new random shifts each time), so remember
        // the password for the browser tab only.
        let cached = null;
        try { cached = sessionStorage.getItem(SESSION_KEY); } catch(e){}
        if (cached){ attempt(cached, true); } else { input.focus(); }
      }

      function main(){
        if (PAYLOAD.enc){ initGate(); } else { run(PAYLOAD.data); }
      }

      if (document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', main); } else { main(); }
    })();
  </script>
</body>
</html>
