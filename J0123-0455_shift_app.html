      // Assign a different random day shift (1..100) to each curve on every page load.
      // Uses unique picks without replacement up to 100; beyond 100, values will wrap.
      function uniqueRandomShifts(n){
        const pool = Array.from({length:100}, (_,i)=>i+1);
        // Fisher-Yates shuffle
        for (let i = pool.length - 1; i > 0; i--){
          const j = Math.floor(Math.random() * (i + 1));
          const t = pool[i]; pool[i] = pool[j]; pool[j] = t;

        for (let k=0;k<n;k++){
